name: Release

# Push a tag such as v0.2.0. The workflow stages that version on npm through
# trusted publishing (no npm token stored anywhere). A maintainer then approves
# the staged version on npmjs.com with 2FA before it goes live.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15 or later.
      - run: npm install -g npm@latest
      - name: Tag matches the version in all three places
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          grep -q "version: \"$v\"" src/index.js
          grep -q "version: \"$v\"" src/plugin.js
      - run: npm ci
      - run: npm test
      - run: npm stage publish
